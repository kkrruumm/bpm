#
# /etc/bpm/bpm.conf - global configuration
#
# this file is sourced by bpm(1), every setting can be overridden by env vars:
#
#    BPM_JOBS=1 bpm build xyz

# where packages are installed
# set to a directory to build a rootfs
: "${BPM_ROOT:=/}"

# sources, build trees, staged destdirs and built binary packages
# this dir must be writable from whatever user runs `bpm build`
: "${BPM_CACHE:=/var/cache/bpm}"

# where `bpm pull` clones the repositories listed in repos.conf
: "${BPM_REPODIR:=/var/db/bpm/repos}"
: "${BPM_REPOCONF:=/etc/bpm/repos.conf}"
: "${BPM_USECONF:=/etc/bpm/package.use}"
: "${BPM_HOOKDIR:=/etc/bpm/hooks}"
: "${BPM_CHO:=var/db/bpm/choices}"
: "${BPM_LOGDIR:=$BPM_CACHE/logs}"

# explicit search order, overrides repos.conf order when set
#: "${BPM_REPOS:=/home/me/my-repo /var/db/bpm/repos/core /var/db/bpm/repos/extra}"

# global build settings
: "${CFLAGS:=-O2 -pipe -mtune=generic}"
: "${CXXFLAGS:=$CFLAGS}"
: "${LDFLAGS:=-Wl,-O1,--as-needed,--sort-common}"

: "${RUSTFLAGS:=-C opt-level=2 -C target-cpu=generic -C link-arg=$LDFLAGS -C target-feature=-crt-static}"
: "${GOFLAGS:=-trimpath -buildvcs=false}"
: "${GOAMD64:=v1}"
: "${CGO_ENABLED:=1}"
: "${ZIGFLAGS:=-Doptimize=ReleaseSafe -Dcpu=baseline}"

# parallelism, defaults to number of cpus in the system 
#: "${BPM_JOBS:=8}"

# 1 = run every build inside private namespaces (recommended)
: "${BPM_SANDBOX:=1}"

# where ephemeral build roots are assembled
# when this is empty builds see the hosts /, which means makedepends have to be
# installed on the host, when it *is* set every build instead gets a throwaway
# root containing BPM_BASEPKGS plus the packages in make_depends and nothing
# else, so an undeclared makedepend becomes a build failure instead of
# something the host silently provides
# needs BPM_SANDBOX=1, and either real root or unprivileged user namespaces
: "${BPM_BUILDROOT:=/var/cache/bpm/buildroot}"

# the base every build root starts from: a shell, the toolchain and whatever else
# their runtime dependencies are pulled in automatically
# these must/should exist as binary packages already
# build them once with BPM_BUILDROOT= if they don't
: "${BPM_BASEPKGS:=baselayout musl busybox make binutils gcc linux-headers bzip2 pigz certs pkgconf zstd xz}"

# 1 = stack the per build layer on the base with overlayfs, 0 = copy the base
# for every build
# unprivileged overlay mounts need linux 5.11 or newer, the copy is the
# fallback if the mount fails anyway
: "${BPM_BROOT_OVERLAY:=1}"

# 1 = keep the per build layer around after the build instead of deleting it
: "${BPM_BROOT_KEEP:=0}"

# a build inside a build root gets a scrubbed environment
# BPM_*, CFLAGS, CXXFLAGS, LDFLAGS and a fixed identity are always passed in,
# these are the PATH the build sees and any extra variables to let through
: "${BPM_BROOT_PATH:=/usr/bin:/usr/sbin:/bin:/sbin}"
#: "${BPM_ENV_KEEP:=http_proxy https_proxy CCACHE_DIR SOURCE_DATE_EPOCH}"

# 1 = strip executables and libraries
: "${BPM_STRIP:=1}"

# 1 = run the check phase when a build style or template provides one
: "${BPM_CHECK:=0}"

# binary package compression: zst, xz, gz or bz2
: "${BPM_COMPRESS:=gz}"
#: "${BPM_ZLEVEL:=19}"

# 1 = rebuild even when a matching binary package already exists
: "${BPM_FORCE:=0}"

# orphans
#
# every package has a reason it was installed, either explicitly or
# it was installed as a dependency implicitly
#
# `bpm autoremove` removes things that were installed as dependencies but
# are no longer needed
#
# 1 = `bpm remove` also removes whatever gets orphaned as a result of the
# transaction automatically
# 0 = no automatic orphan removal, has to be explicitly requested
: "${BPM_AUTOREMOVE:=0}"

# this is a list of packages autoremove will *never* remove regardless of
# what their install reason is, what depends on them, whatever
# globs allowed, this is for things nothing depends on but the system
# has to have
#: "${BPM_KEEP:=linux* grub dhcpcd doas}"

# 1 = show build output live, by default
# build output is suppressed and kept in logs
# that can be viewed with 'bpm log'
: "${BPM_VERBOSE:=0}"

# privilege escalation for the install and remove steps
# you can use either doas, sudo or su for this
#: "${BPM_SU:=doas}"

# "flag" enables a feature, "-flag" disables it
# use flags set here will apply to all packages on the system, and
# per package overrides live in package.use
# resolution order, last wins:
#
#    use_flags (template) -> BPM_USE -> package.use
#
: "${BPM_USE:=zlib ssl man doc -x11 -wayland -pulseaudio -bluetooth -nls}"

# range system accounts are allocated out of when a template doesnt specify a _uid/_gid
#: "${BPM_SYSID_MIN:=100}"
#: "${BPM_SYSID_MAX:=999}"
